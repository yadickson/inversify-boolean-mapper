name: NodeJS Build Process

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:

  checkout:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

  version:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
    - id: version
      uses: yadickson/actions/version@v1
    - run: echo "project version ${PROJECT_VERSION}"
      shell: bash
      env:
        PROJECT_VERSION: ${{ steps.version.outputs.version }}

  build:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: node:22-slim
    steps:
    - uses: yadickson/actions/build@v1

  badge:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Coverage
      run: |
        npm i
        npm t
        npm run test:coverage

    - name: Badge
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: gaelgirodon/ci-badges-action@v1
      with:
        gist-id: 2edc636fc2ff6aff4b056d455f3290be
        token: ${{ secrets.GIST_TOKEN }}
