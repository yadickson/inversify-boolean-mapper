name: NodeJS Build Process

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:    

  version:
    runs-on: ubuntu-latest
    steps:
    - uses: yadickson/actions/version@v1

  install:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: node:22-slim
    steps:
    - uses: yadickson/actions/install@v1

  build:
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22-slim
    steps:
    - uses: yadickson/actions/build@v1

  test:
    name: "unit testing"
    needs: build
    runs-on: ubuntu-latest
    container:
      image: node:22-slim
    steps:
    - uses: yadickson/actions/test@v1

  coverage:
    name: "coverage report"
    needs: build
    runs-on: ubuntu-latest
    container:
      image: node:22-slim
    steps:
    - uses: yadickson/actions/coverage@v1

  # mutation:
  #   name: "mutation testing"
  #   needs: build
  #   runs-on: ubuntu-latest
  #   container:
  #     image: node:22-slim
  #   steps:
  #   - uses: yadickson/actions/mutation@v1

  badge:
    
    needs: [test, coverage]
    runs-on: ubuntu-latest
    container:
      image: node:22-slim
    steps:
    - uses: yadickson/actions/badge@v1
      with:
        gist-id: ${{ secrets.GIST_ID }}
        gist-token: ${{ secrets.GIST_TOKEN }}
